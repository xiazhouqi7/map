<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>世界与中国 · 地图展示</title>
  <meta name="description" content="中国地图与世界地图的高清展示，支持手机与电脑浏览" />
  <style>
    :root{
      --bg:#faf6f1;
      --bg-2:#fff4ec;
      --ink:#2b2b2b;
      --muted:#7a7a7a;
      --card:rgba(255,255,255,.6);
      --blur:10px;
      --radius:18px;
      --shadow:0 8px 30px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 800px at 10% -10%, var(--bg-2) 0, transparent 60%),
        radial-gradient(1200px 800px at 110% 10%, var(--bg-2) 0, transparent 60%),
        var(--bg);
    }
    .wrap{max-width:960px;margin:0 auto;padding:24px 16px 40px}
    header{
      position:sticky;top:0;z-index:10;
      backdrop-filter:saturate(140%) blur(var(--blur));
      background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.35));
      border-bottom:1px solid rgba(0,0,0,.06);
    }
    .bar{
      max-width:960px;margin:0 auto;
      padding:12px 16px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .title{font-size:18px;font-weight:700}
    .nav a{
      text-decoration:none;color:var(--ink);
      font-size:14px;padding:6px 12px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.08);
      background:rgba(255,255,255,.6);
    }
    .grid{display:grid;gap:16px;margin-top:10px}
    @media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid rgba(0,0,0,.06);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .head{padding:14px 16px 0}
    .head h2{margin:0;font-size:16px}
    .head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
    figure{margin:0;padding:12px}
    figure a{display:block}
    img{
      width:100%;
      border-radius:12px;
      cursor:zoom-in;
      background:#f3f3f3;
    }
    figcaption{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      padding:8px 12px 14px;
    }

    /* 图片预览层 */
    .lightbox{
      position:fixed;inset:0;
      background:rgba(0,0,0,.75);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
    }
    .lightbox img{
      max-width:92%;
      max-height:92%;
      border-radius:12px;
      cursor:zoom-out;
    }
    .lightbox:target{display:flex}

    footer{
      margin-top:28px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
    .tip{margin-top:6px}
    .backtop{
      position:fixed;right:16px;bottom:16px;
      padding:8px 12px;
      font-size:13px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow:var(--shadow);
      text-decoration:none;
      color:var(--ink);
    }
  </style>
</head>
<body>
<header id="top">
  <div class="bar">
    <div class="title">世界与中国 · 地图展示</div>
    <nav class="nav">
      <a href="#china">中国</a>
      <a href="#world">世界</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <main class="grid">

    <!-- 中国地图 -->
    <section class="card" id="china">
      <div class="head">
        <h2>中国地图</h2>
        <p>高清展示，适合手机与电脑浏览</p>
      </div>
      <figure>
        <a href="#view-china">
          <img src="china.jpg" alt="中国地图">
        </a>
        <figcaption>点击图片，可查看清晰原图</figcaption>
      </figure>
    </section>

    <!-- 世界地图 -->
    <section class="card" id="world">
      <div class="head">
        <h2>世界地图</h2>
        <p>高清展示，支持放大查看细节</p>
      </div>
      <figure>
        <a href="#view-world">
          <img src="shijie.jpg" alt="世界地图">
        </a>
        <figcaption>点击图片，可查看完整世界地图</figcaption>
      </figure>
    </section>

  </main>

  <footer>
    <div>© 小岛周末 · 地图内容用于学习与展示参考</div>
    <div class="tip">如加载较慢，请耐心等待，高清图片体积较大</div>
  </footer>
</div>

<a class="backtop" href="#top">返回顶部</a>

<!-- 预览层 -->
<div id="view-china" class="lightbox">
  <a href="#"><img src="china.jpg" alt=""></a>
</div>
<div id="view-world" class="lightbox">
  <a href="#"><img src="shijie.jpg" alt=""></a>
</div>

</body>
</html>
